    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai+Looped:wght@700&display=swap" rel="stylesheet" />
    <!-- kiosk frame only; Storybook keeps its own page background -->
    <style>html, body { height: 100%; overflow: hidden; background: #000; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
