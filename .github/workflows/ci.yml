# Every push and pull request: the kiosk and the backend each checked, as before a commit locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiosk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build # typecheck + build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip # --group needs pip 25.1+
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q # the matting and upscaling models are faked: nothing is downloaded
